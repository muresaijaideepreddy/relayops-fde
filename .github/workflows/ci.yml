name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests and offline evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff format --check backend scripts integrations/mcp
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m app.evaluate
        working-directory: backend

  frontend:
    name: TypeScript tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  mcp:
    name: MCP protocol and boundary tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r integrations/mcp/requirements-dev.txt
      - run: python -m pytest integrations/mcp -q

  postgres:
    name: PostgreSQL API integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: relayops
          POSTGRES_PASSWORD: relayops-demo
          POSTGRES_DB: relayops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayops -d relayops"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://relayops:relayops-demo@localhost:5432/relayops
      DEMO_MODE: 'true'
      AI_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - name: Start API
        run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/relayops-api.log 2>&1 &
        working-directory: backend
      - run: python scripts/smoke.py
      - name: API diagnostics
        if: failure()
        run: cat /tmp/relayops-api.log

  container:
    name: Container build and end-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build --wait --wait-timeout 180
      - run: python3 scripts/smoke.py
      - name: Verify bundled frontend
        run: curl --fail http://localhost:8000/ | grep -q '<div id="root">'
      - name: Container diagnostics
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down
